global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'echo-app'
    kubernetes_sd_configs:
      - role: pod
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_label_app]
        action: keep
        regex: echo-app
      - source_labels: [__address__]
        regex: (.+):\d+
        target_label: __address__
        replacement: $1:5000
