[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shorts-factory"
version = "0.1.0"
description = "Quality-gated, multi-channel YouTube Shorts production pipeline for RunPod GPUs"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "anthropic>=1.8",
  "pydantic>=2.7",
  "pyyaml>=6",
  "typer>=0.12",
  "rich>=13",
  "numpy>=1.24",
  "opencv-python-headless>=4.9",
  "pillow>=10",
  "rapidfuzz>=3",
  "google-api-python-client>=2.130",
  "google-auth-oauthlib>=1.2",
  "google-auth-httplib2>=0.2",
  "boto3>=1.36",  # Backblaze B2 via its S3-compatible API
]

[project.optional-dependencies]
# Installed into the main venv on the GPU pod. Chatterbox lives in its own venv
# (see requirements/tts-chatterbox.txt) because it pins torch/diffusers versions.
gpu = [
  "diffusers>=0.36",
  "transformers>=4.56",
  "accelerate>=1.0",
  "sentencepiece",
  "protobuf",
  "ftfy",
  "faster-whisper>=1.2",
  "kokoro>=0.9.4",
  "soundfile",
  "imageio",
  "imageio-ffmpeg",
]
dev = ["pytest>=8", "moto[s3]>=5"]

[project.scripts]
shorts = "shorts_factory.cli:app"

[tool.setuptools.packages.find]
include = ["shorts_factory*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
