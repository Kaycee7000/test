apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: echo-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/YOUR_GITHUB_ORG/YOUR_GITOPS_REPO.git'
    targetRevision: HEAD
    path: 'overlays/echo-dev'
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: echo-dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
